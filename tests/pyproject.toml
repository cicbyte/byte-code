[project]
name = "bytecode-itest"
version = "0.1.0"
description = "ByteCode 平台集成测试（API + UI）；uv 管理，pytest 驱动"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-dependency>=0.6",
    "pytest-order>=1.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "DrissionPage>=4.1",
    "byte-code-pytest>=0.0.2",
]

[tool.pytest.ini_options]
testpaths = ["api", "ui"]
# 依赖顺序三层纪律见 tests/README：fixture 状态链（跨模块）/ order（模块内步骤）/
# dependency（上游失败联动跳过）
addopts = "-ra"
markers = [
    "ui: 浏览器用例（需本机 Chrome；--ui-headed 可视化运行）",
]
