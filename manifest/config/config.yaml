# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":8000"
  # OpenAPI/Swagger 文档：开发环境保留；生产环境建议两项都置空字符串关闭对外暴露
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  # 请求体上限须大于附件大小上限（20MB）
  clientMaxBodySize: "30m"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: "sqlite::@file(./resource/data/app.db)"
    # SQLite 连接级 PRAGMA（驱动会对连接池每条连接生效）：
    # - journal_mode=WAL：允许读写并发，AI 并发场景下显著减少锁竞争
    # - busy_timeout=10000：写锁被占时最多等待 10 秒而非立即报 SQLITE_BUSY
    # - foreign_keys 暂不开启：实测与 schema 的「0=无引用」约定冲突
    #   （requirement_id/assignee_id 等列 DEFAULT 0 且定义了外键，开 FK 后常规写入即违反约束）。
    #   需先将这些可空引用列改为 NULL 语义后方可开启。
    extra: "busy_timeout=10000&journal_mode=WAL"

# Token 认证配置
token:
  # JWT 签名秘钥：留空则首次启动自动生成随机秘钥并保存到 resource/data/jwt.secret
  # 生产环境建议通过环境变量 JWT_SECRET 或此处配置不少于 32 位的随机字符串
  secret: ""

# 跨域配置：默认 *；引入 cookie 会话后须改为显式域名列表（如 ["http://localhost:8002"]）
cors:
  origins:
    - "*"